<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血糖 IRI 统计</title>
    <link rel="stylesheet" href="/tongj/bloodSugar/blood-sugar.css">
</head>
<body>
    <main id="bloodSugarPage" class="blood-sugar-page">
        <header class="blood-sugar-toolbar no-print" aria-label="血糖统计时间工具栏">
            <div class="range-tools" role="group" aria-label="血糖统计时间范围">
                <button id="btnPreviousRange" type="button" class="nav-arrow nav-arrow-left" aria-label="前一天" title="前一天">‹</button>

                <label class="datetime-field">
                    <span class="datetime-label">开始时间</span>
                    <input id="startTime" type="datetime-local" step="60" aria-label="开始时间">
                </label>

                <span class="range-separator" aria-hidden="true">至</span>

                <label class="datetime-field">
                    <span class="datetime-label">结束时间</span>
                    <input id="endTime" type="datetime-local" step="60" aria-label="结束时间">
                </label>

                <button id="btnNextRange" type="button" class="nav-arrow nav-arrow-right" aria-label="后一天" title="后一天">›</button>
            </div>

            <div class="toolbar-spacer"></div>

            <div id="rangeStatus" class="range-status" role="status">等待患者信息</div>

            <button id="btnRefresh" type="button" class="toolbar-button secondary-button">刷新</button>

            <button id="btnExport" type="button" class="toolbar-button primary-button" disabled>导出 Excel</button>
        </header>

        <section class="blood-sugar-report">
            <h1 class="report-title">血糖 IRI 统计</h1>

            <div id="loading" class="page-state loading-state" role="status" hidden>正在加载血糖数据……</div>
            <div id="error" class="page-state error-state" role="alert" hidden></div>
            <div id="empty" class="page-state empty-state" role="status" hidden>当前时间范围暂无血糖数据</div>

            <div id="tableContainer" class="table-wrapper" hidden>
                <table id="dataTable" class="blood-sugar-table">
                    <thead>
                        <tr>
                            <th scope="col">序号</th>
                            <th scope="col">血糖时间</th>
                            <th scope="col">血糖（mmol/L）</th>
                            <th scope="col">胰岛素（U）</th>
                            <th scope="col">激素当量（mg）</th>
                            <th scope="col">校正因子</th>
                            <th scope="col">IRI</th>
                            <th scope="col">激素详情</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="steroidDialog" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="steroidDialogTitle" hidden>
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="steroidDialogTitle">激素使用详情</h2>
                <button id="btnCloseSteroidDialog" type="button" class="modal-close" aria-label="关闭">×</button>
            </div>

            <div class="modal-body">
                <table class="detail-table">
                    <thead>
                        <tr>
                            <th>用药时间</th>
                            <th>药物名称</th>
                            <th>原始剂量</th>
                            <th>原始单位</th>
                            <th>氢化可的松等效剂量（mg）</th>
                        </tr>
                    </thead>
                    <tbody id="steroidDetailBody"></tbody>
                </table>
            </div>

            <div class="modal-footer">
                <button id="btnConfirmSteroidDialog" type="button" class="toolbar-button primary-button">确定</button>
            </div>
        </div>
    </div>

    <!-- SmartCare 早期握手脚本：在 blood-sugar.js 加载前注册 message 监听并缓存宿主消息 -->
    <script>
      (function () {
        'use strict';

        window.__scBloodSugarMsg = null;
        window.__scBloodSugarEarlyMessageHandler = null;

        function extractEarlyPatientId(patient) {
          if (!patient || typeof patient !== 'object') return null;

          var id =
            patient.id ||
            patient._id ||
            patient.pid ||
            patient.patientId ||
            patient.patientID;

          if (!id && patient.patient) {
            id = patient.patient.id || patient.patient._id;
          }

          if (id === undefined || id === null) return null;

          var value = String(id).trim();
          if (!value || value === '[object Object]') return null;
          return value;
        }

        function isCacheableSmartCareMessage(data) {
          if (!data || typeof data !== 'object') return false;
          if (data.type !== 'SmartCare') return false;
          if (!data.patient || typeof data.patient !== 'object') return false;

          // invalid消息也需要缓存，正式脚本需要收到它并清空当前患者
          if (String(data.patient.status || '').trim().toLowerCase() === 'invalid') {
            return true;
          }

          return !!extractEarlyPatientId(data.patient);
        }

        function onEarlyMessage(event) {
          if (!event || event.source !== window.parent) return;
          if (!isCacheableSmartCareMessage(event.data)) return;
          window.__scBloodSugarMsg = event.data;
        }

        // 保存早期监听器引用，供 blood-sugar.js 初始化后移除
        window.__scBloodSugarEarlyMessageHandler = onEarlyMessage;
        window.addEventListener('message', window.__scBloodSugarEarlyMessageHandler);

        // 向 parent 发送 SmartCareReady
        function postEarlyReady() {
          try {
            window.parent.postMessage({ type: 'SmartCareReady' }, '*');
          } catch (e) { /* 不阻止页面初始化 */ }
        }

        // 立即发送一次
        postEarlyReady();

        // window load 时补发一次
        window.addEventListener('load', function () {
          if (!window.__scBloodSugarMsg) {
            postEarlyReady();
          }
        });
      })();
    </script>

    <script src="/tongj/bloodSugar/vendor/xlsx.full.min.js"></script>
    <script src="/tongj/bloodSugar/blood-sugar.js"></script>
</body>
</html>
